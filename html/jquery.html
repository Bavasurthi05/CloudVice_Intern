<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery</title>
</head>
<body>
    <h1 id="demo">Welcome!</h1>
    <button id="btn">Click to change</button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $("#btn").click(function(){
            $("#demo").text("Hello All")
        });
    </script>
</body>
</html>
